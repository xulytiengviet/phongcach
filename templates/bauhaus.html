<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bauhaus Lab — PHONGCÁCH</title><style>:root{--bg:#f4ecd4;--fg:#1b211e;--accent:#c93b28;--font:sans-serif;}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6}a{color:inherit}header,footer{padding:20px 6%;display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid currentColor;font-size:12px;letter-spacing:1px}header a{text-decoration:none}main{max-width:1120px;margin:auto;padding:55px 6% 40px}h1{font-size:clamp(38px,6.5vw,76px);line-height:1.07;letter-spacing:-.05em;margin:20px 0 28px}h2{line-height:1.2}p{max-width:540px}small,.eyebrow{font-size:11px;letter-spacing:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;padding:20px;border:1px solid currentColor}aside{font-size:12px}article{padding:22px;border:1px solid currentColor}.accent{color:var(--accent)}.split{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;min-height:340px}.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.cells strong{display:block;margin-top:15px}.console{border:1px solid var(--accent);padding:26px}.bar{padding:9px 14px;border-bottom:1px solid currentColor;font-size:11px}.bar span{float:right}.cta{display:inline-block;background:var(--accent);color:var(--bg);padding:12px 22px;text-decoration:none;font-weight:bold;margin:25px 0;border:1px solid currentColor}.details{margin-top:55px;padding-top:20px;border-top:1px solid currentColor}.details h2{font-size:22px}footer{margin-top:35px;border-top:1px solid currentColor;border-bottom:0;flex-wrap:wrap}.big{font-size:95px;line-height:1}.center{text-align:center;margin-left:auto;margin-right:auto}blockquote{margin:20px 0;padding-left:18px;border-left:3px solid var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}@media(max-width:600px){main{padding:30px 6%}.split,.cells{grid-template-columns:1fr;gap:22px}header{flex-wrap:wrap}h1{font-size:42px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}.geometry{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1}.geometry i:nth-child(1){background:#c93b28;border-radius:50%}.geometry i:nth-child(2){background:#263c8e}.geometry i:nth-child(3){background:#e9b638;border-radius:0 0 0 100%}.geometry i:nth-child(4){background:#202020;border-radius:50% 50% 0 0}</style></head><body><header><a href="#">STUDIO / 13</a><a href="#about">Khám phá ↗</a></header><main><p class="eyebrow">FORM STUDIES</p><div class="split"><h1>Nghệ thuật<br>của sự<br>đơn giản.</h1><div class="geometry"><i></i><i></i><i></i><i></i></div></div><a class="cta" href="#about">Khám phá ý tưởng ↗</a><section id="about" class="details"><h2>Hình khối kể chuyện.</h2><p>Hình học sơ cấp, đỏ vàng xanh và bố cục Bauhaus. Đây là nội dung minh họa; thay bằng câu chuyện và thông tin dự án của bạn.</p><a href="mailto:hello@example.com">Liên hệ studio →</a></section></main><footer><span>STUDIO / Bauhaus Lab</span><span>Mẫu minh họa · Long Ngo · MIT</span></footer></body></html>
